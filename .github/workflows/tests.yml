name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cai dat phu thuoc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Kiem tra bien dich
        run: python -m compileall -q alphaforge tests

      - name: Kiem tra nhap toan bo package
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import alphaforge
          failed = []
          for module in pkgutil.walk_packages(alphaforge.__path__, "alphaforge."):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:
                  failed.append(f"{module.name}: {exc}")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          print("Toan bo module nhap duoc.")
          PY

      - name: Chay kiem thu
        run: pytest -q
