[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-forge"
version = "0.2.0"
description = "Quy trình nghiên cứu, mô phỏng, chấm điểm và ghi nhớ alpha trên nền tảng WorldQuant BRAIN"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]
# Mô hình ngôn ngữ là tùy chọn. Không cài nhóm này thì toàn bộ quy trình
# nghiên cứu vẫn chạy đầy đủ, chỉ thiếu phần diễn giải bằng văn xuôi.
llm = ["anthropic>=0.39"]

[project.scripts]
alphaforge = "alphaforge.cli:main"

[tool.setuptools.packages.find]
include = ["alphaforge*"]

[tool.setuptools.package-data]
"alphaforge.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Thư mục tests nằm trên đường dẫn nhập để các tệp kiểm thử dùng chung được
# đồ giả lập khai báo trong conftest.
pythonpath = [".", "tests"]
